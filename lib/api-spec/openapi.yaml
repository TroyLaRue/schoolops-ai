openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gmail
    description: Safe Gmail demo-account operations
  - name: calendar
    description: Human-approved Google Calendar follow-up operations
  - name: history
    description: Persistent SchoolOps agent runs and action history
  - name: knowledge
    description: Synthetic SchoolOps policy and procedure knowledge base
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gmail/status:
    get:
      operationId: getGmailStatus
      tags: [gmail]
      summary: Check Gmail connection
      description: Verifies that the server can access the connected Gmail demo account without exposing account credentials or its address.
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"
  /gmail/send:
    post:
      operationId: sendGmailDemoEmail
      tags: [gmail]
      summary: Send an approved synthetic demo email
      description: Sends a reviewed synthetic message to the connected Gmail account itself. The client must require explicit approval before calling this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailDemoEmailInput"
      responses:
        "200":
          description: Demo email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSendResult"
        "400":
          description: Invalid or unsafe message
        "503":
          description: Gmail connection unavailable
  /calendar/status:
    get:
      operationId: getCalendarStatus
      tags: [calendar]
      summary: Check Google Calendar connection
      description: Verifies that the server can access a writable connected calendar without exposing calendar or account details.
      responses:
        "200":
          description: Calendar connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarStatus"
  /calendar/follow-ups:
    post:
      operationId: createCalendarFollowUp
      tags: [calendar]
      summary: Create an approved synthetic follow-up event
      description: Creates a no-attendee event from an already-approved persisted SchoolOps action, then marks that action completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarFollowUpApproval"
      responses:
        "200":
          description: Follow-up event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFollowUpResult"
        "400":
          description: Invalid or unsafe follow-up request
        "404":
          description: Approved action not found
        "409":
          description: Action has not been approved or was already completed
        "503":
          description: Google Calendar connection unavailable
  /history:
    get:
      operationId: getActivityHistory
      tags: [history]
      summary: Review persistent agent activity history
      description: Returns synthetic agent runs, findings, recommendations, approvals, dismissals, drafts, and completed actions.
      responses:
        "200":
          description: Activity history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityHistory"
  /agent-runs:
    post:
      operationId: createAgentRun
      tags: [history]
      summary: Persist a new agent run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "201":
          description: Persisted agent run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agent-runs/{id}/complete:
    post:
      operationId: completeAgentRun
      tags: [history]
      summary: Mark an agent run completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed agent run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "404":
          description: Agent run not found
  /actions:
    post:
      operationId: createAgentAction
      tags: [history]
      summary: Persist a standalone draft or recommended action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionInput"
      responses:
        "201":
          description: Persisted action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAction"
  /actions/{id}:
    patch:
      operationId: updateAgentAction
      tags: [history]
      summary: Approve, dismiss, or complete an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionUpdate"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAction"
        "404":
          description: Action not found
  /policy-documents:
    get:
      operationId: listPolicyDocuments
      tags: [knowledge]
      summary: List policy knowledge documents
      description: Returns active and archived synthetic/demo policy documents available to SchoolOps.
      responses:
        "200":
          description: Policy documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyDocument"
    post:
      operationId: createPolicyDocument
      tags: [knowledge]
      summary: Add a synthetic policy document
      description: Persists reviewed text or Markdown content for demo policy grounding. Binary files and real school records are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDocumentInput"
      responses:
        "201":
          description: Policy document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDocument"
        "400":
          description: Invalid or non-synthetic policy document
        "415":
          description: Unsupported document type
  /policy-documents/{id}:
    patch:
      operationId: updatePolicyDocument
      tags: [knowledge]
      summary: Update or archive a policy document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDocumentUpdate"
      responses:
        "200":
          description: Policy document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDocument"
        "400":
          description: Invalid update
        "404":
          description: Policy document not found
    delete:
      operationId: deletePolicyDocument
      tags: [knowledge]
      summary: Delete a policy document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Policy document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePolicyDocumentResult"
        "404":
          description: Policy document not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GmailStatus:
      type: object
      properties:
        connected:
          type: boolean
        canSend:
          type: boolean
        accountLabel:
          type: string
      required: [connected, canSend, accountLabel]
    GmailDemoEmailInput:
      type: object
      properties:
        recipient:
          type: string
          const: connected-test-account
        subject:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 5000
        approved:
          type: boolean
          const: true
        syntheticDataOnly:
          type: boolean
          const: true
      required: [recipient, subject, body, approved, syntheticDataOnly]
    GmailSendResult:
      type: object
      properties:
        sent:
          type: boolean
        messageId:
          type: string
        recipientLabel:
          type: string
      required: [sent, messageId, recipientLabel]
    CalendarStatus:
      type: object
      properties:
        connected:
          type: boolean
        canCreate:
          type: boolean
        accountLabel:
          type: string
      required: [connected, canCreate, accountLabel]
    CalendarFollowUpApproval:
      type: object
      properties:
        actionId:
          type: integer
        approved:
          type: boolean
          const: true
        syntheticDataOnly:
          type: boolean
          const: true
      required: [actionId, approved, syntheticDataOnly]
    CalendarFollowUpResult:
      type: object
      properties:
        created:
          type: boolean
        eventId:
          type: string
        calendarLabel:
          type: string
        actionId:
          type: integer
        completedAt:
          type: string
          format: date-time
      required: [created, eventId, calendarLabel, actionId, completedAt]
    PolicyDocumentCategory:
      type: string
      enum: [handbook, attendance, enrollment, tuition, procedure]
    PolicyDocumentStatus:
      type: string
      enum: [active, archived]
    PolicyDocumentSourceKind:
      type: string
      enum: [demo, uploaded]
    PolicyDocument:
      type: object
      properties:
        id: { type: integer }
        sourceId: { type: string }
        title: { type: string }
        category: { $ref: "#/components/schemas/PolicyDocumentCategory" }
        description: { type: string }
        filename: { type: [string, "null"] }
        mimeType: { type: string, enum: [text/plain, text/markdown] }
        content: { type: string }
        version: { type: string }
        effectiveDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PolicyDocumentStatus" }
        sourceKind: { $ref: "#/components/schemas/PolicyDocumentSourceKind" }
        syntheticOnly: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, sourceId, title, category, description, filename, mimeType, content, version, effectiveDate, status, sourceKind, syntheticOnly, createdAt, updatedAt]
    PolicyDocumentInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        category: { $ref: "#/components/schemas/PolicyDocumentCategory" }
        description: { type: string, minLength: 3, maxLength: 500 }
        filename: { type: [string, "null"], maxLength: 180 }
        mimeType: { type: string, enum: [text/plain, text/markdown] }
        content: { type: string, minLength: 20, maxLength: 50000 }
        version: { type: string, minLength: 1, maxLength: 40 }
        effectiveDate: { type: [string, "null"], format: date }
        syntheticDataOnly:
          type: boolean
          const: true
      required: [title, category, description, filename, mimeType, content, version, effectiveDate, syntheticDataOnly]
    PolicyDocumentUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        category: { $ref: "#/components/schemas/PolicyDocumentCategory" }
        description: { type: string, minLength: 3, maxLength: 500 }
        content: { type: string, minLength: 20, maxLength: 50000 }
        version: { type: string, minLength: 1, maxLength: 40 }
        effectiveDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PolicyDocumentStatus" }
        syntheticDataOnly:
          type: boolean
          const: true
      required: [syntheticDataOnly]
    DeletePolicyDocumentResult:
      type: object
      properties:
        deleted: { type: boolean }
        id: { type: integer }
      required: [deleted, id]
    AgentActionStatus:
      type: string
      enum: [pending, approved, dismissed, completed]
    AgentRunStatus:
      type: string
      enum: [running, completed, failed]
    AgentAction:
      type: object
      properties:
        id: { type: integer }
        sourceId: { type: string }
        issueId: { type: [integer, "null"] }
        type: { type: string, enum: [communication, task] }
        title: { type: string }
        description: { type: string }
        content: { type: [string, "null"] }
        recipient: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        channel: { type: [string, "null"], enum: [email, sms, calendar, null] }
        reason: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AgentActionStatus" }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        dismissedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
      required: [id, sourceId, issueId, type, title, description, content, recipient, subject, channel, reason, status, createdAt, approvedAt, dismissedAt, completedAt]
    AgentIssue:
      type: object
      properties:
        id: { type: integer }
        sourceId: { type: string }
        title: { type: string }
        category: { type: string }
        severity: { type: string, enum: [critical, attention, healthy] }
        evidence: { type: string }
        impact: { type: string }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: string, format: date-time }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AgentAction" }
      required: [id, sourceId, title, category, severity, evidence, impact, status, createdAt, actions]
    AgentRun:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        activityLog:
          type: array
          items: { type: string }
        summary: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        issueCount: { type: integer }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AgentIssue" }
      required: [id, status, activityLog, summary, startedAt, completedAt, createdAt, issueCount, issues]
    AgentActionInput:
      type: object
      properties:
        runId: { type: [integer, "null"] }
        issueId: { type: [integer, "null"] }
        sourceId: { type: string, minLength: 1 }
        type: { type: string, enum: [communication, task] }
        title: { type: string, minLength: 1 }
        description: { type: string }
        content: { type: [string, "null"] }
        recipient: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        channel: { type: [string, "null"], enum: [email, sms, calendar, null] }
        reason: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AgentActionStatus" }
      required: [sourceId, type, title, description, content, recipient, subject, channel, reason, status]
    AgentActionUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/AgentActionStatus" }
      required: [status]
    AgentIssueInput:
      type: object
      properties:
        sourceId: { type: string }
        title: { type: string }
        category: { type: string }
        severity: { type: string, enum: [critical, attention, healthy] }
        evidence: { type: string }
        impact: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AgentActionInput" }
      required: [sourceId, title, category, severity, evidence, impact, actions]
    AgentRunInput:
      type: object
      properties:
        activityLog:
          type: array
          items: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AgentIssueInput" }
      required: [activityLog, issues]
    ActivityHistory:
      type: object
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AgentAction" }
      required: [runs, actions]

